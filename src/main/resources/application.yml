spring:
  application:
    name: ai-code-mother
  profiles:
    active: local

  session:
    store-type: redis
    timeout: 2592000  # 30天

  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yu_ai_code_mother
    username: root
    password: 123456
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
      database: 0 # redis数据库索引，共16个库，默认为0


server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天后过期
    session:
      cookie:
        max-age: 2592000

springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.aicode.controller
knife4j:
  enable: true
  setting:
    language: zh_cn